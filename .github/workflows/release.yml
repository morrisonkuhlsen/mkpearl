# Release builds. A pushed tag vX.Y.Z (the version in Cargo.toml) builds Pearl for Linux, Windows and
# macOS and publishes it as a GitHub release with SHA256SUMS.txt. Run by hand, it builds the same files
# as workflow artifacts and publishes nothing: a dry run, as is a pull request that changes this file.
#
# How to release: docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, packaging/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version (a tag must match it)
        id: version
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no version in [package]"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: windows-x64, os: windows-2025 }
          - { platform: macos-universal, os: macos-15 }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: pearl-${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (winit, wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libfontconfig1-dev libfreetype-dev libssl-dev

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Build
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked --bin pearl --target "$t"
            done
            mkdir -p target/release
            lipo -create -output target/release/pearl \
              target/aarch64-apple-darwin/release/pearl target/x86_64-apple-darwin/release/pearl
          else
            cargo build --release --locked --bin pearl
          fi

      - name: Package
        run: |
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir "$NAME"
          cp "target/release/pearl$exe" "$NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md THIRD-PARTY-LICENSES.txt "$NAME/"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo run --locked --example icon -- "$NAME/pearl.png"
            cp packaging/linux/install.sh packaging/linux/pearl.desktop "$NAME/"
            tar -czf "$NAME.tar.gz" "$NAME"
            packaging/linux/build-deb.sh "$VERSION" "$NAME" "pearl_${VERSION}_amd64.deb"
          elif [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            choco install innosetup --no-progress -y
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DVersion=$VERSION" "//DFrom=$(cygpath -w "$PWD/$NAME")" "//DOut=$(cygpath -w "$PWD")" packaging/windows/pearl.iss
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi

      - name: Try the Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends "./pearl_${VERSION}_amd64.deb"
          ldd /usr/bin/pearl | { ! grep "not found"; }
          HOME="$(mktemp -d)" sh -c "\"$NAME/install.sh\" && test -x \"\$HOME/.local/bin/pearl\" && test -f \"\$HOME/.local/share/applications/pearl.desktop\" && \"$NAME/install.sh\" --uninstall && test ! -e \"\$HOME/.local/bin/pearl\""

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.zip
            *.deb
            *-setup.exe
          if-no-files-found: error

  publish:
    name: publish
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A version with a suffix (v0.2.0-rc.1) is a pre-release, never shown as the latest.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${prerelease[@]}" --title "Pearl $GITHUB_REF_NAME" --generate-notes
